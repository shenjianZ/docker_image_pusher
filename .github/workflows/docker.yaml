name: Docker Sync Extreme

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 23 * * *'

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:

    # ----------------------------
    - name: Check disk before
      run: df -hT

    # ----------------------------
    # 扩容 runner 磁盘
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        remove-android: 'true'
        remove-codeql: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Restart Docker
      run: sudo service docker restart

    - name: Check disk after maximize
      run: df -hT

    # ----------------------------
    - name: Checkout code
      uses: actions/checkout@v4

    # ----------------------------
    # 安全登录阿里云
    - name: Login to Aliyun Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ALIYUN_REGISTRY }}
        username: ${{ secrets.ALIYUN_REGISTRY_USER }}
        password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

    # ----------------------------
    # 批量 pull -> tag -> push -> prune
    - name: Pull, Tag, Push Images
      run: |
        set -euo pipefail

        # 先确保干净
        docker system prune -af --volumes || true

        while IFS= read -r line || [ -n "$line" ]; do
            # 跳过空行和注释
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^# ]] && continue

            image=$(echo "$line" | awk '{print $NF}')
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            image_name_tag="${image_name_tag%%@*}"

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$image_name_tag"

            echo "=============================="
            echo "Processing: $image"
            echo "Tag as: $new_image"
            echo "=============================="

            docker pull $image
            docker tag $image $new_image
            docker push $new_image

            echo "Cleaning Docker layers & volumes..."
            docker rmi $image || true
            docker rmi $new_image || true
            docker system prune -af --volumes || true

            echo "Disk usage:"
            df -hT
            echo "------------------------------"

        done < images.txt
