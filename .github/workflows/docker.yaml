name: Docker Mirror

on:
  push:
    branches: [ main ]  # 只有 push main 分支触发
  workflow_dispatch:     # 手动触发

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      run: sudo service docker restart

    - name: Login to Aliyun Registry
      run: |
        echo $ALIYUN_REGISTRY_PASSWORD | docker login $ALIYUN_REGISTRY -u $ALIYUN_REGISTRY_USER --password-stdin

    - name: Pull, tag, push images
      run: |
        while IFS= read -r line || [ -n "$line" ]; do
          # 去掉前后空格
          line="$(echo "$line" | xargs)"
          # 忽略空行和注释
          [[ -z "$line" ]] && continue
          [[ "$line" =~ ^# ]] && continue

          # 提取 platform
          platform=""
          image_line="$line"
          if [[ "$line" =~ --platform=([^\ ]+)\ (.+) ]]; then
              platform="${BASH_REMATCH[1]}"
              image_line="${BASH_REMATCH[2]}"
              echo "Detected platform: $platform"
          fi

          # 真实镜像名
          image="$image_line"
          if [ -z "$image" ]; then
              echo "Skipping empty line after cleanup..."
              continue
          fi

          # new_image = 原镜像名（不加 prefix）
          new_image="$image"

          echo "=============================="
          echo "Processing: $image"
          echo "Tag as: $new_image"
          echo "=============================="

          if [ -z "$platform" ]; then
              docker pull "$image"
              docker tag "$image" "$new_image"
              docker push "$new_image"
          else
              # 多平台
              docker buildx build --platform "$platform" --pull -t "$new_image" --push --load <(echo "FROM $image")
          fi

          # 清理空间
          docker rmi "$image" || true
          docker rmi "$new_image" || true
          docker system prune -af --volumes || true
          df -hT
        done < images.txt
