name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '00 23 * * *'

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  # 删除默认平台，不再固定 linux/arm64

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install skopeo
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq skopeo

    - name: Copy image to Aliyun
      run: |
        echo "$ALIYUN_REGISTRY_PASSWORD" | skopeo login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行和注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then continue; fi

            image=$(echo "$line" | xargs)

            echo "----------------------------------------------------"
            echo "正在处理: $image"

            # 取最后斜杠后的镜像名:tag
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$image_name_tag"

            # 阿里云 ACR 个人版不支持 OCI 1.1 empty descriptor
            # (application/vnd.oci.empty.v1+json), buildx imagetools 原样复制会被
            # 403 "unknown manifest class" 拒绝, 改用 skopeo 先转成 docker schema2 再推
            echo "复制镜像到阿里云 (转换为 docker schema2)..."
            if ! skopeo copy --all --retry-times 5 --format v2s2 \
                 "docker://$image" "docker://$new_image"; then
              echo "多架构复制失败, 回退为仅复制 amd64 单架构"
              skopeo copy --retry-times 5 --format v2s2 \
                 "docker://$image" "docker://$new_image"
            fi

            echo "完成: $new_image"
        done < images.txt
