name: Docker Mirror

on:
  push:
    branches: [ main ]  # 只有 push main 分支触发
  workflow_dispatch:     # 手动触发

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      run: sudo service docker restart

    - name: Login to Aliyun Registry
      run: |
        echo $ALIYUN_REGISTRY_PASSWORD | docker login $ALIYUN_REGISTRY -u $ALIYUN_REGISTRY_USER --password-stdin

    - name: Pull, tag, push images
      run: |
        # 过滤有效镜像（忽略注释和空行）
        valid_lines=$(grep -vE '^\s*#|^\s*$' images.txt || true)

        if [ -z "$valid_lines" ]; then
          echo "No images to process. Exiting..."
          exit 0
        fi

        while IFS= read -r line || [ -n "$line" ]; do
          [[ -z "$line" ]] && continue
          [[ "$line" =~ ^# ]] && continue

          # 支持 --platform=linux/arm64 等，可去掉多余空格
          platform_prefix=""
          if [[ "$line" =~ --platform=([^\ ]+) ]]; then
              platform="${BASH_REMATCH[1]}"
              line="${line/--platform=$platform/}"
              platform_prefix="${platform//\//_}_"
          fi

          image=$(echo "$line" | awk '{print $NF}')
          if [ -z "$image" ]; then
              echo "Skipping empty line after cleanup..."
              continue
          fi

          image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
          image_name_tag="${image_name_tag%%@*}"
          new_image="$ALIYUN_REGISTRY/$ALYUN_NAME_SPACE/$platform_prefix$image_name_tag"

          echo "=============================="
          echo "Processing: $image"
          echo "Tag as: $new_image"
          echo "=============================="

          docker pull $image
          docker tag $image $new_image
          docker push $new_image

          echo "Cleaning up disk..."
          docker rmi $image || true
          docker rmi $new_image || true
          docker system prune -af --volumes || true
          df -hT
        done <<< "$valid_lines"
